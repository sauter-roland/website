# Dokploy configuration — builds the project using the repository Dockerfile
# Adjust resource sizes or envs as needed for your Dokploy setup
app:
  name: website

build:
  docker:
    enabled: true
    dockerfile: Dockerfile
    context: .

run:
  env:
    NODE_ENV: production
    PORT: 3000
  ports:
    - "3000:3000"

healthcheck:
  path: /
  port: 3000
  interval: 30s
  timeout: 10s
  retries: 3

resources:
  memory: 512M
  cpu: 0.5

deploy:
  strategy: rolling
